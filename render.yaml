services:
  - type: web
    name: house-of-hamill-food-drive
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: BANDSINTOWN_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: houseofhamill@gmail.com
      - key: DATABASE_URL
        fromDatabase:
          name: food-drive-db
          property: connectionString
    autoDeploy: true

databases:
  - name: food-drive-db
    plan: starter
    databaseName: fooddrive
    user: fooddrive

# Cron job for daily show sync
crons:
  - name: sync-shows
    schedule: "0 6 * * *"
    command: "curl -X POST https://house-of-hamill-food-drive.onrender.com/api/sync-shows"
