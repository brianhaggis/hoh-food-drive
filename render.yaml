services:
  - type: web
    name: hoh-food-drive
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 30
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: BANDSINTOWN_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: houseofhamill@gmail.com
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_PASSWORD
        value: ""
      - key: DATABASE_URL
        sync: false
    autoDeploy: true

