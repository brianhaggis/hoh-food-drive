services:
  - type: web
    name: hoh-food-drive
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: BANDSINTOWN_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: houseofhamill@gmail.com
      - key: DATABASE_URL
        fromDatabase:
          name: food-drive-db
          property: connectionString
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: hoh-food-drive
          property: url
    autoDeploy: true

  - type: cron
    name: sync-shows-cron
    runtime: python
    schedule: "0 6 * * *"
    buildCommand: pip install requests
    startCommand: python -c "import requests, os; requests.post(os.environ['SYNC_URL'])"
    envVars:
      - key: SYNC_URL
        fromService:
          type: web
          name: hoh-food-drive
          property: url
          path: /api/sync-shows

databases:
  - name: food-drive-db
    plan: starter
    databaseName: fooddrive
    user: fooddrive
